services:
  sst-rag-worker:
    build:
      context: .
      dockerfile: app/back/Dockerfile
    command: ["/app/app/back/docker/worker-entrypoint.sh"]
    environment:
      CHATBOT_RUNTIME_CHUNKS_ROOT: /app/data/projects/sst-general/chunks
      CHATBOT_RUNTIME_EMBEDDINGS_ROOT: /app/data/embeddings
      CHATBOT_RUNTIME_WARM_INTERVAL_SECONDS: ${CHATBOT_RUNTIME_WARM_INTERVAL_SECONDS:-1800}
      HF_HUB_CACHE: /var/lib/chatbot-sst/hf-cache
      SST_PERSISTENCE_MODE: ${SST_PERSISTENCE_MODE:-memory}
      SST_POSTGRES_DSN: ${SST_POSTGRES_DSN:-}
    volumes:
      - ./data:/app/data
      - chatbot-hf-cache:/var/lib/chatbot-sst/hf-cache
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/chatbot-runtime-worker-ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  sst-rag-api:
    build:
      context: .
      dockerfile: app/back/Dockerfile
    command: ["/app/app/back/docker/api-entrypoint.sh"]
    depends_on:
      sst-rag-worker:
        condition: service_healthy
    environment:
      CHATBOT_RUNTIME_API_BIND_HOST: 0.0.0.0
      CHATBOT_RUNTIME_API_PORT: 8780
      CHATBOT_RUNTIME_CHUNKS_ROOT: /app/data/projects/sst-general/chunks
      CHATBOT_RUNTIME_EMBEDDINGS_ROOT: /app/data/embeddings
      HF_HUB_CACHE: /var/lib/chatbot-sst/hf-cache
      SST_PERSISTENCE_MODE: ${SST_PERSISTENCE_MODE:-memory}
      SST_POSTGRES_DSN: ${SST_POSTGRES_DSN:-}
    ports:
      - "8780:8780"
    volumes:
      - ./data:/app/data
      - chatbot-hf-cache:/var/lib/chatbot-sst/hf-cache
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8780/readyz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

volumes:
  chatbot-hf-cache:
