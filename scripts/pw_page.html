/* Pastillas de estado con código de color: relleno suave + borde del mismo tono
   para que el estado salte a la vista sin depender solo del color (el texto
   siempre está presente). Tonos semánticos, no hex crudos. */
.ui-status-chip.neutral,
.ui-meta {
  background: var(--neutral-soft);
  border-color: var(--neutral-border);
  color: var(--neutral-ink);
}

.ui-status-chip.success {
  background: var(--success-soft);
  border-color: var(--success-border);
  color: var(--success-ink);
}

.ui-status-chip.warning {
  background: var(--warning-soft);
  border-color: var(--warning-border);
  color: var(--warning-ink);
}

.ui-status-chip.danger {
  background: var(--danger-soft);
  border-color: var(--danger-border);
  color: var(--danger-ink);
}

@media (prefers-reduced-motion: no-preference) {
  .ui-status-chip {
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }
}

/* Énfasis contextual de selección: el conteo corriente se realza como pastilla de
   acento cuando hay al menos una fila seleccionada. El control (el texto del
   conteo) está SIEMPRE presente; solo cambia su tratamiento visual. */
.inventory-selection-summary {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.35;
}

.inventory-selection-summary.active {
  background: var(--accent-soft);
  border: 1px solid var(--accent-border);
  border-radius: 999px;
  color: var(--accent-ink);
  font-weight: 760;
  padding: 5px 11px;
}

/* Con selección activa la barra del inventario gana un fondo de acento sutil que
   agrupa conteo y acciones en bloque, sin ocultar ni mover controles. */
.inventory-tools.has-selection {
  background: var(--accent-warm);
  border: 1px solid var(--accent-line);
  border-radius: 12px;
  margin: -6px -8px 0;
  padding: 8px;
}

@media (prefers-reduced-motion: no-preference) {

  .inventory-tools.has-selection {
    transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
}

/* --- Matriz de variantes (Task 8) ------------------------------------- */
/* La matriz ocupa la columna ancha; el aside (form + variantes) la estrecha.
   Espejo invertido de .platform-grid: aquí lo primario es la rejilla de celdas. */
.variant-grid {
  align-items: start;
  display: grid;
  gap: 16px;
  grid-template-columns: minmax(0, 1fr) minmax(0, 360px);
}

.variant-aside {
  display: grid;
  gap: 16px;
  min-width: 0;
}

/* Rejilla de tarjetas-receta (no una tabla densa): auto-fill responsive. */
.variant-matrix {
  display: grid;
  gap: 12px;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  list-style: none;
  margin: 0;
  padding: 0;
}

.variant-cell {
  background: var(--panel-soft);
  border: 1px solid var(--accent-line);
  border-radius: 10px;
  display: grid;
  gap: 10px;
  padding: 12px;
  text-align: left;
  width: 100%;
}

/* Construible = botón seleccionable; el foco de teclado queda visible. */
button.variant-cell {
  cursor: pointer;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

button.variant-cell:hover {
  border-color: var(--accent-border);
}

button.variant-cell:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* Selección inequívoca: borde y halo de acento, además del texto de estado. */
button.variant-cell.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}

/* Bloqueada: tarjeta inerte y atenuada; el motivo se lee en texto, no por color. */
.variant-cell.blocked {
  background: var(--panel);
  opacity: 0.72;
}

.variant-cell-head {
  align-items: center;
  display: flex;
  gap: 8px;
  justify-content: space-between;
}

.variant-cell-head strong {
  color: var(--accent-ink);
  font-size: 13px;
}

.variant-cell-dims {
  display: grid;
  gap: 6px;
  margin: 0;
}

.variant-cell-dims div {
  display: grid;
  gap: 2px;
}

.variant-cell-dims dt {
  color: var(--muted);
  font-size: 10px;
  font-weight: 760;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}

.variant-cell-dims dd {
  color: var(--text);
  font-size: 12px;
  margin: 0;
  word-break: break-all;
}

.variant-cell-status {
  align-items: center;
  display: inline-flex;
  font-size: 11px;
  font-weight: 760;
  gap: 6px;
}

.variant-cell-status.buildable {
  color: var(--accent);
}

.variant-cell-status.blocked {
  color: var(--muted);
}

@media (max-width: 900px) {
  .variant-grid {
    grid-template-columns: 1fr;
  }
}

@media (prefers-reduced-motion: reduce) {
  button.variant-cell {
    transition: none;
  }
}
